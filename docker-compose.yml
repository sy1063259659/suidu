services:
  suidu-storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/suidu && chown 10001:1000 /data/suidu && chmod 2770 /data/suidu"]
    volumes:
      - suidu-files:/data
  sftpgo:
    image: drakkan/sftpgo:v2.7.5
    restart: unless-stopped
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__NAME: ${SFTPGo_DB_NAME:-sftpgo}
      SFTPGO_DATA_PROVIDER__HOST: ${SFTPGo_DB_HOST:?SFTPGo_DB_HOST is required}
      SFTPGO_DATA_PROVIDER__PORT: 5432
      SFTPGO_DATA_PROVIDER__USERNAME: ${SFTPGo_DB_USER:-sftpgo}
      SFTPGO_DATA_PROVIDER__PASSWORD: ${SFTPGo_DB_PASSWORD:?SFTPGo_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:12022:2022"
      - "127.0.0.1:18082:8080"
    volumes:
      - sftpgo-data:/var/lib/sftpgo
      - suidu-files:/srv/sftpgo/data
      - sftpgo-backups:/srv/sftpgo/backups
    healthcheck:
      test: ["CMD", "sftpgo", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - suidu-network
  suidu-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    environment:
      SUIDU_PORT: 8080
      SUIDU_DATABASE_URL: ${SUIDU_DATABASE_URL:?SUIDU_DATABASE_URL is required}
      SUIDU_REDIS_ADDR: ${SUIDU_REDIS_ADDR:?SUIDU_REDIS_ADDR is required}
      SUIDU_REDIS_PASSWORD: ${SUIDU_REDIS_PASSWORD:?SUIDU_REDIS_PASSWORD is required}
      SUIDU_REDIS_DB: ${SUIDU_REDIS_DB:-5}
      SUIDU_REDIS_KEY_PREFIX: ${SUIDU_REDIS_KEY_PREFIX:-suidu:}
      SUIDU_COOKIE_SECURE: ${SUIDU_COOKIE_SECURE:-true}
      SUIDU_SESSION_TTL: ${SUIDU_SESSION_TTL:-168h}
      SUIDU_STORAGE_ROOT: ${SUIDU_STORAGE_ROOT:-/var/lib/suidu/files/suidu}
      SUIDU_MAX_FILE_BYTES: ${SUIDU_MAX_FILE_BYTES:-104857600}
    volumes:
      - suidu-files:/var/lib/suidu/files
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      suidu-storage-init:
        condition: service_completed_successfully
    networks:
      - suidu-network
  suidu-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:80"
    depends_on:
      - suidu-api
    networks:
      - suidu-network

networks:
  suidu-network:
    name: ${SUIDU_DOCKER_NETWORK:-suidu-network}
    external: true

volumes:
  sftpgo-data:
  suidu-files:
  sftpgo-backups:
